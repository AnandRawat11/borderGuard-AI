<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IBVAP command center for monitoring camera feeds, reviewing security alerts, and inspecting forensic evidence." />
    <meta name="theme-color" content="#FAFAFC" />
    <title>IBVAP | Intelligent Border Video Analytics Platform</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ibvap-theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-txt-primary overflow-hidden font-sans antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
