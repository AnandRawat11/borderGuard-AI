name: IBVAP CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: ibvap-backend/requirements.lock

      - name: Install Python dependencies
        run: python -m pip install -r ibvap-backend/requirements.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile backend
        run: python -m compileall -q ibvap-backend/app

      - name: Run backend and frontend tests
        run: make test

      - name: Build frontend
        run: make build
